<!DOCTYPE html>
<!-- =============================================================
  POC OCR SURAT JALAN → KODE MATERIAL (Tesseract.js, 100% GRATIS)
  Halaman uji terpisah — TIDAK menyentuh aplikasi produksi.
  Cara kerja:
    1) Foto SJ (kamera atau file)
    2) Tesseract.js mengenali teks LANGSUNG di HP (offline, tanpa API key)
    3) Kandidat kode material di-extract (pola rujukan vendor + pola RDI)
    4) Dicocokkan (fuzzy) dengan daftar kode Master Item yang di-paste
  Catatan: sekali pertama kali, data bahasa (~15 MB) diunduh dari CDN
  lalu tersimpan cache browser → pemakaian berikutnya offline.
============================================================= -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POC OCR Surat Jalan → Kode Material</title>
<script src="./tesseract.min.js"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:16px;background:#f1f5f9;color:#0f172a}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;color:#64748b;margin:0 0 14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
label.fl{font-size:12px;font-weight:700;color:#475569;display:block;margin:0 0 6px}
input[type=file]{width:100%;font-size:14px}
.preview{max-width:100%;border:1px solid #cbd5e1;border-radius:8px;margin-top:8px;display:none}
.btn{background:#334155;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.green{background:#059669}
.chk{font-size:13px;margin-top:8px;display:block}
textarea{width:100%;min-height:110px;font:12px/1.45 monospace;border:1px solid #cbd5e1;border-radius:8px;padding:8px}
#log{font:12px/1.5 monospace;background:#0f172a;color:#a5f3fc;border-radius:8px;padding:10px;min-height:64px;white-space:pre-wrap;word-break:break-word}
#hasil{font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px dashed #94a3b8;border-radius:8px;padding:10px;max-height:240px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
th{background:#eef2f7;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td code{font-weight:700}
.matched{background:#dcfce7}
.dim{color:#94a3b8}
</style>
</head>
<body>
<h1>POC OCR Surat Jalan → Kode Material</h1>
<p class="sub">100% gratis &amp; offline (Tesseract.js) • halaman uji, bukan bagian aplikasi</p>

<div class="card">
  <label class="fl">1. Foto Surat Jalan</label>
  <input type="file" id="foto" accept="image/*" capture="environment">
  <img id="preview" class="preview" alt="Pratinjau foto SJ">
  <label class="chk"><input type="checkbox" id="preproc" checked> Praproses gambar (hitam-putih + kontras, bantu hasil foto gudang)</label>
  <button class="btn green" id="btn-ocr" disabled>Teken Teks (OCR)</button>
  <span id="waktu" class="dim"></span>
</div>

<div class="card">
  <label class="fl">2. Daftar kode Master Item (paste sekali — tersimpan di HP)</label>
  <textarea id="master" placeholder="Paste kolom kode material produk di sini, satu kode per baris. Contoh:&#10;MRO-01-09-301&#10;MRO-02-14-115&#10;SPR-03-02-018"></textarea>
  <button class="btn" id="btn-clear-master">Hapus daftar</button>
</div>

<div class="card">
  <label class="fl">3. Kandidat kode material ditemukan</label>
  <table id="tbl"><thead><tr><th>Kandidat dari SJ</th><th>Cocok dgn Master?</th><th>Skor</th></tr></thead><tbody id="tbody"><tr><td colspan="3" class="dim">Belum ada — teken teks dulu.</td></tr></tbody></table>
</div>

<div class="card">
  <label class="fl">Log &amp; teks mentah</label>
  <div id="log">Siap. Pilih foto SJ untuk mulai.</div>
</div>
<div class="card">
  <label class="fl">Teks mentah hasil OCR</label>
  <div id="hasil">—</div>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var logEl = $('log'), hasilEl = $('hasil'), tbody = $('tbody');
function log(s) { logEl.textContent = s; }
function log2(s) { logEl.textContent += '\n' + s; }

/* ---------- daftar master: simpan di localStorage ---------- */
var LS_KEY = 'poc-ocr-master';
try { $('master').value = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
$('master').addEventListener('change', function () { try { localStorage.setItem(LS_KEY, $('master').value); } catch (e) {} });
$('btn-clear-master').addEventListener('click', function () { $('master').value = ''; try { localStorage.removeItem(LS_KEY); } catch (e) {} });

function daftarMaster() {
  return $('master').value.split(/[\r\n]+/).map(function (s) { return s.trim().toUpperCase(); }).filter(function (s) { return s.length >= 3; });
}

/* ---------- pratinjau + praproses gambar ---------- */
var cv = document.createElement('canvas');
var cvCtx = cv.getContext('2d', { willReadFrequently: true });

$('foto').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var img = new Image();
  img.onload = function () {
    /* foto SJ diturunkan resolusinya ke sisi terpanjang 1600px (OCR lebih stabil & hemat memori HP) */
    var MAX = 1600, r = Math.min(1, MAX / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
    cvCtx.drawImage(img, 0, 0, cv.width, cv.height);
    if ($('preproc').checked) praproses();
    var pv = $('preview');
    pv.src = cv.toDataURL('image/jpeg', 0.9);
    pv.style.display = 'block';
    $('btn-ocr').disabled = false;
    log('Foto siap (' + cv.width + 'x' + cv.height + ' px). Tekan tombol OCR.');
  };
  img.src = URL.createObjectURL(f);
});

function praproses() {
  var d = cvCtx.getImageData(0, 0, cv.width, cv.height), px = d.data, i, y, g;
  /* skala abu-adu + peregangan kontras sederhana (5–95 persentil) */
  var hist = new Array(256).fill(0);
  for (i = 0; i < px.length; i += 4) { g = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000 | 0; hist[g]++; }
  var total = px.length / 4, ak = 0, lo = 0, hi = 255, target = total * 0.05;
  for (i = 0; i < 256; i++) { ak += hist[i]; if (ak >= target) { lo = i; break; } }
  ak = 0;
  for (i = 255; i >= 0; i--) { ak += hist[i]; if (ak >= target) { hi = i; break; } }
  var span = Math.max(16, hi - lo);
  for (i = 0; i < px.length; i += 4) {
    g = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000 | 0;
    g = Math.max(0, Math.min(255, (g - lo) * 255 / span)) | 0;
    px[i] = px[i + 1] = px[i + 2] = g;
  }
  cvCtx.putImageData(d, 0, 0);
}

/* ---------- OCR ---------- */
$('btn-ocr').addEventListener('click', function () {
  var btn = this;
  btn.disabled = true; btn.textContent = 'Membaca…';
  var t0 = Date.now();
  log('OCR berjalan (pertama kali mengunduh data bahasa ~15 MB, sabar ya)…');
  /* NOTE: corePath/langPath default → CDN jsDelivr; worker & data ter-cache browser */
  Tesseract.recognize(cv, 'ind+eng', { logger: function (m) { if (m.status === 'recognizing text') { log('Membaca teks… ' + Math.round((m.progress || 0) * 100) + '%'); } } })
    .then(function (res) {
      var dur = ((Date.now() - t0) / 1000).toFixed(1);
      btn.disabled = false; btn.textContent = 'Teken Teks (OCR)';
      $('waktu').textContent = dur + ' s';
      var txt = (res.data.text || '').replace(/[ \t]+/g, ' ').trim();
      hasilEl.textContent = txt || '(tidak ada teks terbaca)';
      log('Selesai dalam ' + dur + ' s. Kandidat kode dianalisis…');
      analisa(txt);
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = 'Teken Teks (OCR)';
      log('Gagal OCR: ' + (e && e.message ? e.message : e));
    });
});

/* ---------- analisa kandidat kode + fuzzy match ---------- */
/* Pola kode yang diakui:
   - pola code RDI/ERP: huruf-angka bergaris, contoh MRO-01-09-301 / SPR-03-02-018 / 91012345
   - fallback: token pendek dengan angka & huruf campur, bukan kata umum id/eng */
var RE_KODE = /\b[A-Z]{1,5}[-\/]?[0-9]{1,4}(?:[-\/.][A-Z0-9]{1,6})+\b/g;
var RE_SN   = /\b[0-9]{4,9}\b/g;

function jarakLev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, prev = new Array(n + 1), cur, i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur = [i];
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function skor(kandidat, master) {
  /* 100 = sama persis; <60 = di bawah ambang ditolak */
  if (kandidat === master) return 100;
  var d = jarakLev(kandidat, master);
  var s = Math.round(100 * (1 - d / Math.max(kandidat.length, master.length)));
  return s;
}

function analisa(txt) {
  var up = ' ' + txt.toUpperCase() + ' ';
  var set = {};
  /* 1) pola kode bergaris-rapi — paling bisa dipertanggungjawabkan */
  var m, k, c;
  RE_KODE.lastIndex = 0;
  while ((m = RE_KODE.exec(up)) !== null) { k = m[0].replace(/[^A-Z0-9\-\/.]/g, ''); if (k.length >= 4) set[k] = 'pola'; }
  /* 2) nomor serial/PO panjang polos */
  RE_SN.lastIndex = 0;
  while ((m = RE_SN.exec(up)) !== null) { k = m[0]; if (!(k in set)) set[k] = 'nomor'; }
  /* 3) token gabungan OCR sering cacat: gabungkan yang berjarak 1 spasi */
  var tok = up.split(/[\s|]+/).filter(Boolean);
  for (var i = 0; i < tok.length - 1; i++) {
    k = (tok[i] + '-' + tok[i + 1]).replace(/[^A-Z0-9\-\/.]/g, '');
    if (/^[A-Z]{1,5}[-\/][0-9]/.test(k) && !(k in set)) set[k] = 'gabungan';
  }
  var kandidat = Object.keys(set).slice(0, 25);
  var master = daftarMaster();
  var rows = kandidat.map(function (kc) {
    var best = null, bs = 0;
    master.forEach(function (mc) { var s = skor(kc, mc); if (s > bs) { bs = s; best = mc; } });
    return { k: kc, jenis: set[kc], best: (bs >= 75 ? best : ''), sk: bs };
  }).sort(function (a, b) { return b.sk - a.sk || (a.jenis === 'pola' ? -1 : 1); });
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="3" class="dim">Tidak ada kandidat. Coba foto lebih dekat/terang atau matikan praproses.</td></tr>'; return; }
  tbody.innerHTML = '';
  rows.forEach(function (r) {
    var tr = document.createElement('tr');
    if (r.best) tr.className = 'matched';
    tr.innerHTML = '<td><code>' + r.k + '</code><br><span style="font-size:10px" class="dim">' + r.jenis + '</span></td>' +
      '<td>' + (r.best ? r.best : '<span class="dim">— tidak ada di daftar —</span>') + '</td>' +
      '<td>' + r.sk + '</td>';
    tr.addEventListener('click', function () { try { navigator.clipboard.writeText(r.best || r.k); } catch (e) {} });
    tbody.appendChild(tr);
  });
  logEl.textContent += '\nSelesai: ' + rows.length + ' kandidat, ' + rows.filter(function (r) { return r.best; }).length + ' cocok dengan daftar (skor ≥ 75).';
}
</script>
</body>
</html>
